[project]
name = "warszawa-backend"
version = "0.1.0"
description = "backend service for USC AI agentic advisor system"
authors = [
    {name = "Mansur Tiyes"}
]
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "langgraph (>=1.1.9,<2.0.0)",
    "langchain-anthropic (>=1.4.1,<2.0.0)",
    "langchain-chroma (>=1.1.0,<2.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "python-multipart (>=0.0.26,<0.0.27)",
    "pymupdf (>=1.27.2.3,<2.0.0.0)",
    "chromadb (>=1.5.8,<2.0.0)",
    "pydantic (>=2.13.3,<3.0.0)",
    "pydantic-settings (>=2.0.0,<3.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "lxml (>=6.1.0,<7.0.0)",
    "langchain-openai (>=1.2.1,<2.0.0)",
    "langchain-google-genai (>=4.2.2,<5.0.0)",
    "langchain (>=1.2.17,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)"
]
